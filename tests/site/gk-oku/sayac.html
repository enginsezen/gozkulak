<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Sayaç</title>
<style>body{font:16px/1.6 Arial,sans-serif;margin:20px} .counter{display:flex;gap:4px;align-items:baseline} .counter span{font-size:32px}</style></head><body>
<!-- Sayaçlar son değerleriyle okunur (e2e/sayac.mjs). Elementor sayacı benzetimi: metin 0'dan 100'e sayar. -->
<main>
<h2>Rakamlarla Biz</h2>
<div class="elementor-counter"><div class="elementor-counter-title">Müşteri Memnuniyeti</div><div class="counter"><span class="elementor-counter-number" data-duration="2000" data-to-value="100" data-from-value="0">0</span><span>%</span></div></div>
<div class="elementor-counter"><div class="elementor-counter-title">Tamamlanan Proje</div><div class="counter"><span class="count" data-count="1250">0</span></div></div>
<p>Destek ekibimize <a href="#iletisim" data-target="#iletisim">buradan</a> ulaşabilirsiniz.</p>
<p>Kuruluş yılımız <span data-count="yok">1996</span> olarak kayıtlıdır.</p>
</main>
<script>
// Sayaç benzetimi: her adımda metin düğümü yenilenir (jQuery .text() gibi)
window.startCounters = () => {
	for (const el of document.querySelectorAll("[data-to-value], .count")) {
		const end = +(el.dataset.toValue || el.dataset.count);
		let v = 0;
		const t = setInterval(() => { v = Math.min(end, v + Math.ceil(end / 40)); el.textContent = String(v); if (v >= end) clearInterval(t); }, 50);
	}
};
</script>
